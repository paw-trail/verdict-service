<text x="820" y="428" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827">verdict-service  :8086</text>
<text x="820" y="448" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">장소마다 · 반려동물마다 동반 가능 여부를 판정</text>
<text x="820" y="464" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">API 2개  (공개 1 · internal 1) · DB · 캐시 없음</text>
<text x="622.0" y="381.0" font-size="13" font-weight="bold" text-anchor="start" fill="#22C55E">이 레포</text>
<rect x="55.0" y="255.0" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.2"/>
<text x="180" y="278" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">gateway-server</text>
<text x="180" y="298" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">토큰 검증</text>
<text x="180" y="314" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">X-User-Id · X-User-Role 주입</text>
<rect x="55.0" y="490.0" width="250" height="100" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2.2"/>
<text x="180" y="518" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">user-service</text>
<text x="180" y="538" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">즐겨찾기 · 최근 · 일정 · 방문 카드</text>
<text x="180" y="554" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">판정 배지와 준비물</text>
<rect x="55.0" y="720.0" width="250" height="80" rx="12" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2.2" stroke-dasharray="9,7"/>
<text x="180" y="738" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">search-service</text>
<text x="180" y="758" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">검색 카드</text>
<text x="180" y="774" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">아직 없음</text>
<rect x="660.0" y="80.0" width="320" height="80" rx="12" fill="#E0E7FF" stroke="#6366F1" stroke-width="2.2"/>
<text x="820" y="106" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">config-server</text>
<text x="820" y="126" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">포트 한 줄</text>
<rect x="1410.0" y="80.0" width="300" height="80" rx="12" fill="#E0E7FF" stroke="#6366F1" stroke-width="2.2"/>
<text x="1560" y="106" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">eureka-server</text>
<text x="1560" y="126" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">등록 · lb:// 해석</text>
<rect x="1410.0" y="325.0" width="300" height="110" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2.2"/>
<text x="1560" y="350" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">pet-service</text>
<text x="1560" y="370" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">반려동물을 한 번에 100마리</text>
<text x="1560" y="386" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">체중 · 크기 · 맹견 · 이동장 · 접종</text>
<text x="1560" y="402" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">남의 것은 조용히 뺌</text>
<rect x="1410.0" y="585.0" width="300" height="110" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2.2"/>
<text x="1560" y="610" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">policy-service</text>
<text x="1560" y="630" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">장소마다 조건 20칸 · 근거</text>
<text x="1560" y="646" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">충돌 여부 · 정정 출처</text>
<text x="1560" y="662" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">한 번에 500곳</text>
<rect x="660.0" y="740.0" width="320" height="80" rx="12" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2.2" stroke-dasharray="9,7"/>
<text x="820" y="758" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Kafka</text>
<text x="820" y="778" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">policy.changed · pet.profile.updated</text>
<text x="820" y="794" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">캐시를 붙일 때 받음</text>
