<rect x="314" y="276" width="229" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="318" y="288" font-size="13" font-weight="normal" text-anchor="start" fill="#3B82F6">GET /api/v1/places/{placeId}/verdict</text>
<polyline points="305.0,540 560,540 560,470 630,470" fill="none" stroke="#16A34A" stroke-width="2.4" marker-end="url(#ah-16A34A)"/>
<rect x="314" y="516" width="191" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="318" y="528" font-size="13" font-weight="normal" text-anchor="start" fill="#16A34A">POST /internal/verdicts/batch</text>
<polyline points="305.0,760 600,760 600,490 630,490" fill="none" stroke="#9CA3AF" stroke-width="2.4" marker-end="url(#ah-9CA3AF)" stroke-dasharray="7,6"/>
<rect x="314" y="736" width="88" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="318" y="748" font-size="13" font-weight="normal" text-anchor="start" fill="#9CA3AF">같은 목록 판정</text>
<polyline points="820,160.0 820,395.0" fill="none" stroke="#6366F1" stroke-width="2.4" marker-end="url(#ah-6366F1)"/>
<rect x="782" y="258" width="76" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="820.0" y="269.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#6366F1">기동 시 설정</text>
<polyline points="1010,430 1130,430 1130,120 1410.0,120" fill="none" stroke="#6366F1" stroke-width="2.4" marker-end="url(#ah-6366F1)"/>
<rect x="1138" y="193" width="34" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1142" y="205" font-size="13" font-weight="normal" text-anchor="start" fill="#6366F1">등록</text>
<polyline points="1010,450 1200,450 1200,380 1410,380" fill="none" stroke="#16A34A" stroke-width="2.4" marker-end="url(#ah-16A34A)"/>
<rect x="1208" y="356" width="168" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1212" y="368" font-size="13" font-weight="normal" text-anchor="start" fill="#16A34A">① GET /internal/pets?ids=</text>
<polyline points="1010,480 1240,480 1240,640 1410,640" fill="none" stroke="#16A34A" stroke-width="2.4" marker-end="url(#ah-16A34A)"/>
<rect x="1248" y="548" width="206" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1252" y="560" font-size="13" font-weight="normal" text-anchor="start" fill="#16A34A">② POST /internal/policies/batch</text>
<polyline points="820,740.0 820,505.0" fill="none" stroke="#9CA3AF" stroke-width="2.4" marker-end="url(#ah-9CA3AF)" stroke-dasharray="7,6"/>
<rect x="828" y="628" width="88" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="832" y="640" font-size="13" font-weight="normal" text-anchor="start" fill="#9CA3AF">아직 받지 않음</text>
<text x="40" y="880" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">반려견마다 네 단계로 판정 — 불가 &gt; 확인 필요 &gt; 조건부 &gt; 가능 · 판정에 필요한 칸이 비면 가능 대신 확인 필요 · 이유 줄마다 근거와 추출 방식</text>
<text x="40" y="902" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">pet → policy 를 차례로 한 번씩 부름 · 사용자 헤더 둘이 pet 호출에 그대로 따라감 · 헤더가 없으면 401 · 둘 중 하나라도 못 부르면 502</text>
<text x="40" y="924" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">DB · 캐시 · 이벤트 없음 — 부를 때마다 새로 판정 · 캐시와 이벤트 소비는 부하를 잰 뒤 · 장소 정보는 화면이 가져 place 를 부르지 않음</text>
<text x="1836" y="948" font-size="11" text-anchor="end" fill="#9CA3AF">verdict-service 를 중심으로 · 직접 연결된 것만</text></svg>